<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://sharpscript.local; script-src 'self' https://sharpscript.local 'unsafe-eval'; style-src 'self' https://sharpscript.local 'unsafe-inline'; font-src 'self' https://sharpscript.local data:; worker-src 'self' blob:;" />
  <title>C# Script</title>
  <link rel="stylesheet" href="vs/editor/editor.main.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/status.css" />
  <link rel="stylesheet" href="css/window.css" />
  <link rel="stylesheet" href="css/references.css" />
</head>
<body>
<svg width="0" height="0" style="position: absolute; overflow: hidden;" aria-hidden="true">
  <defs>
    <linearGradient id="eBlue" gradientUnits="userSpaceOnUse" x1="0" y1="8.5" x2="0" y2="15.5">
      <stop offset="0" stop-color="#78a8ff"></stop><stop offset="0.16" stop-color="#3f74e8"></stop>
      <stop offset="0.5" stop-color="#1a44b4"></stop><stop offset="0.82" stop-color="#0c1f5e"></stop>
      <stop offset="1" stop-color="#2e63c8"></stop>
    </linearGradient>
    <linearGradient id="eRed" gradientUnits="userSpaceOnUse" x1="0" y1="8.5" x2="0" y2="15.5">
      <stop offset="0" stop-color="#ff9b86"></stop><stop offset="0.16" stop-color="#ee5237"></stop>
      <stop offset="0.5" stop-color="#c02414"></stop><stop offset="0.82" stop-color="#65100a"></stop>
      <stop offset="1" stop-color="#d84430"></stop>
    </linearGradient>
    <linearGradient id="eGloss" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="12.2">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="eCap"><rect x="1.5" y="8.5" width="21" height="7" rx="3.5"></rect></clipPath>
    <filter id="eShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0.4" dy="0.7" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.55"></feDropShadow>
    </filter>
    <g id="icPill" filter="url(#eShadow)">
      <g transform="rotate(-45 12 12)">
        <g clip-path="url(#eCap)">
          <rect x="1.5" y="8.5" width="10.5" height="7" fill="url(#eBlue)" stroke="none"></rect>
          <rect x="12" y="8.5" width="10.5" height="7" fill="url(#eRed)" stroke="none"></rect>
          <rect x="3.4" y="9.15" width="17.2" height="2.3" rx="1.15" fill="url(#eGloss)" stroke="none"></rect>
          <rect x="11.3" y="8.5" width="1.4" height="7" fill="#08080c" stroke="none" opacity="0.55"></rect>
        </g>
        <rect x="1.5" y="8.5" width="21" height="7" rx="3.5" fill="none" stroke="#06060a" stroke-width="0.9" opacity="0.8"></rect>
        <rect x="1.5" y="8.5" width="21" height="7" rx="3.5" fill="none" stroke="#ffffff" stroke-width="0.55" opacity="0.42"></rect>
      </g>
    </g>
    <g id="icSharp" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.68"><path d="M17.6 15.8 16.8 22.2M20.8 15.8 20 22.2M15.6 18.4h6.3M15.3 20.8h6.3"></path></g>
    <g id="icRun" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.58"><path d="M16.6 15.3 22 18.5l-5.4 3.2z" fill="currentColor"></path></g>
    <g id="icBuild" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M18.5 14.6v5.2M16.2 17.6l2.3 2.2 2.3-2.2M15.2 22.6h6.6"></path></g>
    <g id="icBreak" transform="translate(-32.4 -32.4) scale(2.4)"><circle cx="18.6" cy="18.6" r="3.3" fill="currentColor" stroke="none"></circle></g>
    <g id="icInspect" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><circle cx="18" cy="18" r="3.1"></circle><path d="M20.4 20.4 22.6 22.6"></path></g>
    <g id="icConsole" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M15.4 16.2h6.4M15.4 19h6.4M15.4 21.8h3.6"></path></g>
    <g id="icErr" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M16.1 16.1 21.4 21.4M21.4 16.1 16.1 21.4"></path></g>
    <g id="icPlus" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M15.2 18.5h6.6M18.5 15.2v6.6"></path></g>
    <g id="icIn" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M22.2 18.5h-6M18.7 16l-2.5 2.5 2.5 2.5"></path></g>
    <g id="icOut" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M15.8 18.5h6M19.3 16l2.5 2.5-2.5 2.5"></path></g>
    <g id="icLayL" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><rect x="3.5" y="4.5" width="5.5" height="15" fill="currentColor" stroke="none" opacity="0.85"></rect></g>
    <g id="icLayR" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><rect x="15" y="4.5" width="5.5" height="15" fill="currentColor" stroke="none" opacity="0.85"></rect></g>
    <g id="icLayB" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><rect x="3.5" y="14" width="17" height="5.5" fill="currentColor" stroke="none" opacity="0.85"></rect></g>
    <g id="icLayT" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><rect x="3.5" y="4.5" width="17" height="4" fill="currentColor" stroke="none" opacity="0.85"></rect></g>
    <g id="icDockL" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5v15M21 12H9.5M13 8.5 9.5 12l3.5 3.5"></path></g>
    <g id="icDockR" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 4.5v15M3 12h11.5M11 8.5l3.5 3.5-3.5 3.5"></path></g>
    <g id="icBreakOff" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"></circle><path d="M5.6 18.4 18.4 5.6"></path></g>
    <g id="icWrap" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 11.5h12.5a3 3 0 0 1 0 6H12M4 16.5h4M10 14.5 7.5 17l2.5 2.5"></path></g>
    <g id="icLocate" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21"></path></g>
    <g id="icTerm"><path d="M5 7.5 9.5 12 5 16.5M12.5 16.5h6.5"></path></g>
    <g id="icFormat"><path d="M4 6.5h16M4 11.5h10M4 16.5h13"></path></g>
    <g id="icZen" stroke-linecap="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"></path></g>
    <g id="icContinue" transform="translate(-32.4 -32.4) scale(2.4)" stroke-width="0.83"><path d="M15.4 15.2v6.6M17.4 15.4 22 18.5l-4.6 3.1z" fill="none"></path></g>
    <g id="icStop" transform="translate(-32.4 -32.4) scale(2.4)"><rect x="16.2" y="16.2" width="5" height="5" rx="0.6" fill="currentColor" stroke="none"></rect></g>
  </defs>
</svg>

<div id="shell">

  <header id="titlebar">
    <svg class="logo" viewBox="0 0 24 24" width="18" height="18"><use href="#icPill"></use></svg>
    <div id="title" class="title"></div>
    <div class="grow"></div>
    <div class="window-buttons">
      <button id="win-min" title="Minimize" class="win"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" fill="none"><path d="M2 6h8"></path></svg></button>
      <button id="win-max" title="Maximize" class="win"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" fill="none"><rect x="2.5" y="2.5" width="7" height="7"></rect></svg></button>
      <button id="win-close" title="Close" class="win danger"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" fill="none"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"></path></svg></button>
    </div>
  </header>

  <div id="splitter" class="splitter hidden" title="Drag to resize"></div>

  <div class="resize nw" data-edge="topleft"></div>
  <div class="resize n" data-edge="top"></div>
  <div class="resize ne" data-edge="topright"></div>
  <div class="resize w" data-edge="left"></div>
  <div class="resize e" data-edge="right"></div>
  <div class="resize sw" data-edge="bottomleft"></div>
  <div class="resize s" data-edge="bottom"></div>
  <div class="resize se" data-edge="bottomright"></div>


  <div id="body">

    <nav id="rail">
      <button id="t-sidebar" class="rail-button" title="Files and parameters"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icLayL"></use></svg></button>
      <button id="t-panel" class="rail-button" title="Output, terminal and problems"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icLayB"></use></svg></button>
      <button id="t-toolbar" class="rail-button" title="Toolbar"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icLayT"></use></svg></button>
      <div class="rail-divider"></div>
      <button id="t-zen" class="rail-button" title="Hide all chrome"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icZen"></use></svg></button>

      <div class="rail-divider"></div>
      <button id="dock-left" class="rail-button" title="Dock to the left of the canvas"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icDockL"></use></svg></button>
      <button id="dock-right" class="rail-button" title="Dock to the right of the canvas"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icDockR"></use></svg></button>

      <button id="locate" class="rail-button" title="Find this component on the canvas"><svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icLocate"></use></svg></button>

      <div class="grow"></div>
      <button id="dock-close" class="rail-button hidden" title="Close the editor"><svg width="13" height="13" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" fill="none"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"></path></svg></button>
    </nav>

    <aside id="sidebar">
      <div class="section-head">
        <span>Files</span>
        <button id="add" class="ghost" title="Add a file"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icPlus"></use></svg></button>
      </div>
      <ul id="files" class="files"></ul>

      <div class="rule"></div>

      <div class="section-head">
        <span class="with-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icIn"></use></svg>Inputs</span>
      </div>
      <div id="inputs" class="params"></div>

      <div class="section-head">
        <span class="with-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icOut"></use></svg>Outputs</span>
      </div>
      <div id="outputs" class="params"></div>

      <div class="grow"></div>

      <div class="sidebar-foot">
        <button id="references" class="foot-row"><span id="references-label">References</span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icPlus"></use></svg></button>
        <button id="folder" class="foot-row"><span>Open project folder</span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icOut"></use></svg></button>
      </div>
    </aside>

    <div id="split-sidebar" class="pane-splitter vertical" title="Drag to resize"></div>

    <main id="main">

      <div id="toolbar">
        <button id="breakpoints" class="icon breakpoint" title="Remove all breakpoints"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"><use href="#icBreak"></use></svg></button>
        <button id="breakpoints-toggle" class="icon" title="Disable all breakpoints"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><use href="#icBreakOff"></use></svg></button>
        <button id="inspect" class="icon" title="Inspect variables"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icInspect"></use></svg></button>
        <button id="wrap-code" class="icon" title="Wrap long lines"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><use href="#icWrap"></use></svg></button>
        <button id="t-minimap" class="icon" title="Minimap"><svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="1.4" fill="none"><use href="#icLayR"></use></svg></button>
        <button id="format" class="icon" title="Format document"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><use href="#icFormat"></use></svg></button>

        <div id="debug-bar" class="debug-bar hidden">
          <div class="toolbar-divider"></div>
          <span class="debug-label">Paused</span>
          <button id="continue" class="icon" title="Continue"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icContinue"></use></svg></button>
          <button id="stop" class="icon" title="Stop the script"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"><use href="#icStop"></use></svg></button>
        </div>

        <div class="grow"></div>

        <button id="compile" class="primary"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><use href="#icBuild"></use></svg>Compile</button>
        <button id="run" class="secondary"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><use href="#icRun"></use></svg>Run</button>
      </div>

      <div id="editor"></div>

      <div id="split-panel" class="pane-splitter horizontal" title="Drag to resize"></div>

      <section id="panel">
        <div class="tabs">
          <button id="tab-output" class="tab"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icConsole"></use></svg>Output</button>
          <button id="tab-problems" class="tab"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icErr"></use></svg>Problems<span id="problem-count" class="badge hidden">0</span></button>
          <button id="tab-variables" class="tab"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icInspect"></use></svg>Variables</button>
          <div class="grow"></div>
          <button id="panel-clear" class="link">Clear</button>
          <button id="panel-wrap" class="link">Wrap</button>
        </div>

        <div class="panel-body">
          <div id="view-output" class="view log"></div>
          <ul id="view-problems" class="view problems"></ul>
          <div id="view-variables" class="view variables"></div>
        </div>
      </section>

      <footer id="status">
        <span class="status-item"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><use href="#icBuild"></use></svg><span id="status-build">Not compiled</span></span>
        <span id="status-caret" class="status-item">Ln 1, Col 1</span>
        <span id="status-indent" class="status-item">Spaces: 4</span>
        <span class="status-item">UTF-8</span>
        <div class="grow"></div>
        <button id="status-breakpoints" class="status-item breakpoints hidden" title="Breakpoints"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"><use href="#icBreak"></use></svg><span id="status-breakpoints-text">0 breakpoints</span></button>

        <div id="breakpoint-menu" class="menu hidden">
          <button id="menu-toggle" class="menu-item">Disable all breakpoints</button>
          <button id="menu-remove" class="menu-item">Remove all breakpoints</button>
        </div>
        <span id="runtime" class="status-item">net7.0 · Roslyn</span>
        <span class="status-item">C# 11</span>
      </footer>
    </main>
  </div>
</div>

<div id="references-panel" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>References</span>
      <button id="references-close" class="ghost" title="Close">&#215;</button>
    </div>

    <div class="modal-body">

      <section class="ref-group">
        <h3 class="ref-heading">Packages<span id="ref-packages-count" class="count"></span></h3>

        <div class="ref-search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round"><use href="#icInspect"></use></svg>
          <input id="ref-search" placeholder="Search nuget.org, or type a package id" autocomplete="off" />
          <ul id="ref-results" class="ref-results hidden"></ul>
        </div>

        <ul id="ref-packages" class="ref-list"></ul>
      </section>

      <section class="ref-group">
        <h3 class="ref-heading">
          Assemblies<span id="ref-local-count" class="count"></span>
          <button id="ref-add-local" class="link">Add a DLL</button>
        </h3>
        <ul id="ref-local" class="ref-list"></ul>
      </section>

      <section class="ref-group">
        <button id="ref-host-toggle" class="ref-disclosure">
          <span class="chevron">&#9656;</span>Provided by Rhino<span id="ref-host-count" class="count"></span>
        </button>
        <div id="ref-host" class="ref-host hidden"></div>
      </section>

    </div>

    <div class="modal-foot">
      <span id="ref-note" class="note"></span>
      <button id="ref-restore" class="link">Restore</button>
      <button id="ref-edit-csproj" class="link">Open Script.csproj</button>
    </div>
  </div>
</div>

<script src="vs/loader.js"></script>
<script src="theme.js"></script>
<script src="csharp.js"></script>
<script src="sample.js"></script>
<script src="probe.js"></script>
<script src="app/state.js"></script>
<script src="app/bridge.js"></script>
<script src="app/layout.js"></script>
<script src="app/panel.js"></script>
<script src="app/breakpoints.js"></script>
<script src="app/language.js"></script>
<script src="app/files.js"></script>
<script src="app/references.js"></script>
<script src="app/nuget.js"></script>
<script src="app/status.js"></script>
<script src="app/main.js"></script>
</body>
</html>
