name: PillScript
version: 0.3.0
authors:
  - Mateusz Zwierzycki
description: >
  PillScript is a C# script component for Grasshopper in Rhino 8.

  The editor is Monaco with Roslyn behind it. Completion, hover, signature help and diagnostics use
  the same reference set as the build, so the editor and the Compile command report the same
  errors. Compilation runs on F5. Until then the component keeps running its last build, and a
  coloured plate on the canvas marks it as out of date.

  Each script is a folder with a csproj in it. The folder opens in Visual Studio, Rider or VS Code
  with completion against the running Rhino, and PackageReference entries restore with the .NET
  SDK. Inputs and outputs come from the RunScript signature, so no parameter is dragged on by hand.
  F9 sets a breakpoint. The solve stops there and shows the locals while Rhino keeps responding.

  A script can also register controls that appear in a Rhino panel, docked with Layers and
  Properties. Override RegisterUi and call the registrar once per control. Each call draws one
  control and assigns its current value to the variable passed in. Several components share the
  panel, and a script may carry a ui.css to restyle it.

  The plugin runs on Windows only, on Rhino 8.30 or newer, and needs the WebView2 runtime that
  Rhino 8 installs for its own interface.
